<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>番茄钟时长</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #fff8f2;
    color: #6b5b4f;
    padding: 14px;
    user-select: none;
  }
  h3 { font-size: 14px; margin-bottom: 10px; }
  label { display: block; font-size: 12px; margin: 8px 0 4px; }
  input {
    width: 100%;
    padding: 6px 8px;
    border: 2px solid #d8c8bd;
    border-radius: 8px;
    font-size: 13px;
    color: #6b5b4f;
    background: #fff;
    outline: none;
  }
  input:focus { border-color: #a98fd0; }
  .hint { font-size: 11px; color: #a89888; margin-top: 4px; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button {
    flex: 1;
    padding: 7px 0;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  #ok { background: #a98fd0; color: #fff; }
  #cancel { background: #e8ddd5; color: #6b5b4f; }
</style>
</head>
<body>
  <h3>设置时长</h3>
  <label id="field-label">分钟数</label>
  <input id="min" type="number" min="1" max="180" step="1">
  <div class="hint">范围 1～180 分钟</div>
  <div class="row">
    <button id="cancel">取消</button>
    <button id="ok">确定</button>
  </div>
  <script>
    const LABELS = { focus: '专注时长（分钟）', break: '短休息时长（分钟）', long: '长休息时长（分钟）' };
    const params = new URLSearchParams(location.search);
    const field = params.get('field') || 'focus';
    document.getElementById('field-label').textContent = LABELS[field] || '分钟数';
    const minEl = document.getElementById('min');
    minEl.focus();
    minEl.select();

    document.getElementById('ok').addEventListener('click', () => {
      const v = Math.round(Number(minEl.value));
      if (v >= 1 && v <= 180) window.petAPI.submitPomoMin(field, v);
      else window.petAPI.cancelPomoInput();
    });
    document.getElementById('cancel').addEventListener('click', () => window.petAPI.cancelPomoInput());
    minEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('ok').click(); });
  </script>
</body>
</html>
