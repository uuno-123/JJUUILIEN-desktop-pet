<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>编辑台词</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #fff8f2;
    color: #6b5b4f;
    padding: 14px;
    user-select: none;
  }
  h3 { font-size: 14px; margin-bottom: 2px; }
  .hint { font-size: 11px; color: #a89888; margin-bottom: 8px; line-height: 1.5; }
  #fields { max-height: 420px; overflow-y: auto; padding-right: 4px; }
  label { display: block; font-size: 12px; font-weight: bold; margin: 6px 0 3px; }
  textarea {
    width: 100%;
    padding: 5px 8px;
    border: 2px solid #d8c8bd;
    border-radius: 8px;
    font-size: 12px;
    font-family: inherit;
    color: #6b5b4f;
    background: #fff;
    outline: none;
    resize: vertical;
    line-height: 1.5;
  }
  textarea:focus { border-color: #a98fd0; }
  textarea.empty { border-style: dashed; }
  textarea.preset { border-style: dashed; }
  details {
    border: 2px solid #e8ddd5;
    border-radius: 8px;
    margin-top: 8px;
    background: #fffdf9;
    overflow: hidden;
  }
  summary {
    padding: 6px 10px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    color: #8a7466;
    background: #f7efe7;
    list-style: none;
  }
  summary::before { content: '▸ '; }
  details[open] summary::before { content: '▾ '; }
  .ev-body { padding: 4px 10px 8px; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1;
    padding: 7px 0;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  #ok { background: #a98fd0; color: #fff; }
  #cancel { background: #e8ddd5; color: #6b5b4f; }
</style>
</head>
<body>
  <h3>编辑台词</h3>
  <div class="hint">
    每行一条台词，切换时随机抽一条（每项最多 10 条、每条 60 字）。<br>
    虚线框里的是<b>示例台词</b>，直接改就行；<b>把某一栏删空 = 这条台词彻底不显示</b>（形态和事件都一样，删掉就没有台词框了）。<br>
    可用变量：{greet} 时段问候、{now} 当前时间、{date} 日期、{min} 番茄分钟数、{h} 整点小时、{left} 剩余待办、{text} 待办内容、{list} 待办前几条、{more} 待办剩余数。
  </div>
  <div id="fields"></div>
  <div class="row">
    <button id="cancel">取消</button>
    <button id="ok">保存</button>
  </div>
  <script>
    const FORM_LABELS = ['待机', '站立', '抱抱', '听歌（音乐联动）', '生日', '微笑'];
    const FORM_DEFAULTS = [
      '啾~（Juju 安宁~）',
      '站得直直的！',
      '抱抱…',
      '总是戴着耳机听歌（其实一直在放歌）',
      '今天是生日吗？？？？',
      'ISFJ 微笑服务中'
    ];
    const MAX_LINES = 10;

    // 事件台词定义：[key, 显示名, 内置默认（占位提示）, 额外变量说明]
    const EVENT_GROUPS = [
      { name: '互动与状态', items: [
        ['pat', '摸头（点头 / 双击摸头）', '摸头杀…（开心）'],
        ['hand', '点手（挥手的爪爪）', '牵牵手…（最喜欢你了）'],
        ['musicStop', '音乐结束（回到待机）', '音乐停了…'],
        ['sleep', '睡着了', 'Zzz…（Juju 睡着了）'],
        ['wake', '睡醒', '哈欠……（揉眼睛醒来）'],
        ['unlock', '解锁电脑回来', '你回来啦！（一直在这儿等你）'],
        ['todoDone', '待办勾选完成（{left}=剩余件数）', '又搞定一件！{left}'],
        ['todoAllDone', '待办全部做完', '待办全都做完啦，今天可以轻轻松松'],
        ['reminder', '待办到点提醒（{text}=待办内容）', '⏰ 到点啦：{text}'],
        ['reminderSoon', '待办提前 5 分钟', '⏰ 还有 5 分钟：{text}'],
        ['todoSay', '念待办（{list}=前几条、{more}=剩余数）', '待办：{list}{more}']
      ]},
      { name: '生活提醒', items: [
        ['sedentary', '久坐提醒', '已经坐了 45 分钟啦！站起来动一动'],
        ['water', '喝水提醒', '该喝水啦！（推来一杯水）'],
        ['batteryOff', '电源断开', '没插电源…（记得充电）'],
        ['batteryOn', '接通电源', '充上电啦！'],
        ['netOffline', '断网了', '断网了…（世界安静了）'],
        ['netOnline', '网络恢复', '网回来啦！']
      ]},
      { name: '番茄钟', items: [
        ['pomoStart', '开始专注', '开始专注！{min} 分钟（我会安静陪着你的）'],
        ['pomoBreak', '短休息开始', '专注结束！休息 {min} 分钟～'],
        ['pomoLong', '长休息开始', '完成 4 轮！大休息 {min} 分钟，最棒了！'],
        ['pomoResume', '休息结束继续专注', '休息结束！新一轮专注开始'],
        ['levelUp', '好感度升级（{lv}=等级 {lvName}=等级名）', '我们的感情升级啦！现在是 Lv.{lv} · {lvName} ♡'],
        ['pomoStop', '手动停止番茄钟', '番茄钟停止了（下次再来）'],
        ['pomoWarn1', '还剩 1 分钟', '还剩 1 分钟～'],
        ['pomoWarn10', '还剩 10 秒', '还剩 10 秒！']
      ]},
      { name: '整点报时', items: [
        ['hourly', '整点报时（{h}=小时）', '{h} 点整啦~']
      ]}
    ];

    const fields = document.getElementById('fields');

    // 读取当前设置
    let savedForms = {};
    let savedEvents = {};
    try {
      const s = window.petAPI.getSettings();
      if (s && s.lines) savedForms = s.lines;
      if (s && s.eventLines) savedEvents = s.eventLines;
    } catch (_) {}

    // 形态台词
    const formBoxes = FORM_LABELS.map((label, i) => {
      const lab = document.createElement('label');
      lab.textContent = label;
      const ta = document.createElement('textarea');
      ta.rows = 2;
      // 预填：保存过 → 已保存内容（含清空的空白）；从未保存过 → 示例默认句
      const saved = Array.isArray(savedForms[i]);
      ta.value = saved ? savedForms[i].join('\n') : (FORM_DEFAULTS[i] || '');
      if (!saved) ta.classList.add('preset');
      ta.addEventListener('input', () => ta.classList.remove('preset'));
      fields.appendChild(lab);
      fields.appendChild(ta);
      return ta;
    });

    // 事件台词（分组折叠）
    const eventBoxes = {};
    for (const g of EVENT_GROUPS) {
      const det = document.createElement('details');
      const sum = document.createElement('summary');
      sum.textContent = g.name;
      det.appendChild(sum);
      const body = document.createElement('div');
      body.className = 'ev-body';
      for (const [key, label, def] of g.items) {
        const lab = document.createElement('label');
        lab.textContent = label;
        const ta = document.createElement('textarea');
        ta.rows = 2;
        // 预填：用户保存过 → 显示已保存内容（含清空后的空白）；从未保存过 → 预填示例默认句
        const saved = Array.isArray(savedEvents[key]);
        ta.value = saved ? savedEvents[key].join('\n') : def;
        if (!saved) ta.classList.add('preset');   // 预填示例的框加个淡色标记
        ta.addEventListener('input', () => ta.classList.remove('preset'));
        body.appendChild(lab);
        body.appendChild(ta);
        eventBoxes[key] = ta;
      }
      det.appendChild(body);
      fields.appendChild(det);
    }

    document.getElementById('ok').addEventListener('click', () => {
      const lines = formBoxes.map((ta) => ta.value.split('\n').map((s) => s.trim()).filter(Boolean).slice(0, MAX_LINES));
      const events = {};
      for (const [key, ta] of Object.entries(eventBoxes)) {
        // 空也写入：空数组 = 这条台词不显示（示例删掉就真的没了）
        events[key] = ta.value.split('\n').map((s) => s.trim()).filter(Boolean).slice(0, MAX_LINES);
      }
      window.petAPI.submitLines(lines, events);
    });
    document.getElementById('cancel').addEventListener('click', () => window.petAPI.cancelLines());
  </script>
</body>
</html>
