<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
  <title>Juju 桌宠</title>
</head>
<body>
  <!-- 直接使用原图素材，保持原始比例，不做任何变形 -->
  <!-- 气泡放在角色容器内，锚定头顶，随形态/缩放自动跟随 -->
  <div id="pet-wrap">
    <div id="bubble"><span id="bubble-text"></span></div>
    <div id="badge">💤</div>
    <div id="pet-visual">
      <img id="pet-img" src="assets/juju-idle.png" alt="Juju" draggable="false" />
      <!-- 眼睛跟随层由 pet.js 动态插入 -->
    </div>
  </div>

  <script src="pet.js"></script>
</body>
</html>
